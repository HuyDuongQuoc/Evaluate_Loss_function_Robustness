experiment:
  task: classification

  seeds:
    - 42
    - 123
    - 2026

  losses:
    - ce
    - gce
    - sce

dataset:
  n_samples: 5000
  n_features: 20
  n_informative: 15
  n_redundant: 5
  n_classes: 3
  class_sep: 1.0

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

model:
  input_dim: 20
  hidden_dims:
    - 64
    - 32

noise:
  levels:
    - 0.0
    - 0.2
    - 0.4

loss:
  gce_q: 0.7
  sce_alpha: 0.1
  sce_beta: 1.0

training:
  batch_size: 64
  epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  num_workers: 0
  device: auto

output:
  root_dir: results
  save_checkpoint: true