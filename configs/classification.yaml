experiment:
  task: classification
  seeds: [42, 123, 2026]

dataset:
  n_samples: 5000
  n_features: 20
  n_informative: 15
  n_redundant: 5
  n_classes: 3
  class_sep: 1.0

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

preprocessing:
  standardize_features: true

noise:
  type: symmetric
  levels: [0.0, 0.2, 0.4]

evaluation:
  metrics:
    - accuracy
    - macro_f1

model:
  input_dim: 20
  hidden_dims: [64,32] #20->64->32
  output_dim: 3
  activation: relu     

training:
  batch_size: 64
  epochs: 100

  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0

  num_workers: 0
  device: auto