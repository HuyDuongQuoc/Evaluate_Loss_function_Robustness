experiment:
  task: regression
  seeds:
    - 42
    - 123
    - 2026

  losses:
    - mse
    - mae
    - huber

dataset:
  n_samples: 5000
  n_features: 20
  n_informative: 15
  bias: 0.0

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

model:
  input_dim: 20
  hidden_dims:
    - 64
    - 32

noise:
  levels:
    - 0.0
    - 0.1
    - 0.2

  scale: 1.0

loss:
  huber_delta_factor: 0.1

training:
  batch_size: 64
  epochs: 100
  optimizer: adam
  learning_rate: 0.001
  weight_decay: 0.0
  num_workers: 0
  device: auto

output:
  root_dir: results
  save_checkpoint: true