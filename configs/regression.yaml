experiment:
  task: regression
  seeds: [42, 123, 2026]

dataset:
  n_samples: 5000
  n_features: 20
  n_informative: 15
  bias: 0.0

split:
  train_size: 0.70
  val_size: 0.15
  test_size: 0.15

preprocessing:
  standardize_features: true

noise:
  levels: [0.0, 0.1, 0.2]
  scale: 1.0

evaluation:
  metrics:
    - mae
    - rmse